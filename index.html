<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A class-photo skeletal anatomy practical study lab for skull, axial, and appendicular structures."><title>Skeletal Lab | Practical Study</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2631'/%3E%3Cpath d='M17 29C17 16 27 11 38 14c8 2 12 9 10 18l-4 14-8 5-16-3-3-9z' fill='%23d8f0ec'/%3E%3Ccircle cx='37' cy='29' r='5' fill='%230b2631'/%3E%3Cpath d='M24 45h15' stroke='%230b2631' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{--ink:#12252d;--muted:#5d6d72;--paper:#f5f8f7;--surface:#fff;--line:#dbe6e3;--accent:#087e78;--accent2:#d7f1eb;--danger:#a44144;--shadow:0 16px 40px #0b303015}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.shell{max-width:1380px;margin:auto;padding:0 24px}.top{background:#0b2631;color:#f4fbf9}.top .shell{padding-top:18px;padding-bottom:18px;display:flex;align-items:center;gap:24px}.brand{font-weight:780;letter-spacing:-.03em;font-size:1.18rem;white-space:nowrap}.brand small{display:block;color:#a9cbc5;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;gap:4px;flex:1;overflow:auto}.nav button{border:0;background:transparent;color:#d2e4e0;padding:9px 12px;border-radius:8px;white-space:nowrap}.nav button.active,.nav button:hover{background:#16404b;color:#fff}.mode{border:1px solid #47707a!important;color:#fff!important;padding:7px 11px!important}.page{padding:34px 0 64px}.eyebrow{color:var(--accent);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.intro h1{font-size:clamp(1.8rem,4vw,3.1rem);margin:3px 0 0;line-height:1.04;letter-spacing:-.045em}.intro p{color:var(--muted);max-width:650px;margin:10px 0 0}.countdown{padding:12px 16px;border-left:3px solid var(--accent);background:#eaf6f3;border-radius:0 8px 8px 0;font-weight:700}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}h2{font-size:1.25rem;margin:0 0 12px;letter-spacing:-.02em}h3{margin:0 0 8px;font-size:1rem}.setup{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:.79rem;color:var(--muted);font-weight:700;margin-bottom:5px}.field select,.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary,.secondary,.ghost{border:0;border-radius:8px;padding:10px 14px;font-weight:750}.primary{background:var(--accent);color:white}.secondary{background:var(--accent2);color:#075c57}.ghost{background:#eff4f2;color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#f4f8f7;border:1px solid var(--line);padding:14px;border-radius:10px}.metric strong{display:block;font-size:1.65rem;line-height:1.1}.metric span{color:var(--muted);font-size:.85rem}.source-list{padding-left:18px;color:var(--muted);font-size:.87rem}.note{font-size:.87rem;color:var(--muted);padding:11px 12px;background:#f2f7f6;border-radius:8px;margin-top:14px}.question-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.6fr);gap:22px}.image-frame{text-align:center}.image-stage{display:inline-block;position:relative;max-width:100%;line-height:0}.photo{width:auto;max-width:100%;max-height:620px;background:#17262a;border-radius:10px;display:block}.source-marker{position:absolute;left:var(--marker-x);top:var(--marker-y);width:34px;height:34px;transform:translate(-50%,-50%);border:4px solid #ffd84d;border-radius:50%;box-shadow:0 0 0 3px #10252bbb,0 0 18px #0008;pointer-events:none}.source-marker::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd84d;left:50%;top:50%;transform:translate(-50%,-50%)}.meta{color:var(--muted);font-size:.86rem}.answer-row{display:flex;gap:10px;margin:14px 0}.answer-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:11px}.feedback{padding:13px;border-radius:9px;margin:12px 0;font-size:.92rem}.correct{background:#e6f5ed;color:#176438}.wrong{background:#fbeded;color:#81383b}.spelling{background:#fff4cf;color:#705815}.learn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.learn-card{border:1px solid var(--line);border-radius:10px;padding:13px;text-align:left;background:white}.learn-card:hover,.learn-card.active{border-color:var(--accent);background:#f1fbf8}.pill{display:inline-block;font-size:.72rem;background:#e7f4f1;color:#08726c;padding:3px 7px;border-radius:20px;margin-bottom:5px}.statline{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:9px 0;font-size:.94rem}.empty{padding:24px;color:var(--muted);text-align:center}.coverage{width:100%;border-collapse:collapse;font-size:.9rem}.coverage th,.coverage td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.coverage th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.status{font-size:.72rem;font-weight:800;padding:3px 7px;border-radius:20px;white-space:nowrap}.playable{background:#dff3eb;color:#13704e}.needed{background:#f7eeee;color:#93494b}.progressbar{height:7px;background:#e5edeb;border-radius:8px;overflow:hidden;margin:12px 0 18px}.progressbar i{height:100%;display:block;background:var(--accent)}.review-title{font-size:1.7rem;margin:0 0 8px}.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.review-card{border:1px solid var(--line);border-radius:12px;padding:14px}.review-card .image-stage{display:block;width:max-content;margin:0 auto 12px}.review-card .photo{height:180px}.orientation-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:16px 0}.orientation{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:.88rem}.small{font-size:.84rem;color:var(--muted)}body.dark{--ink:#e7f0ee;--muted:#aabdb9;--paper:#102126;--surface:#172b31;--line:#315057;--accent:#49beb5;--accent2:#164d4b;--shadow:none}body.dark .field select,body.dark .field input,body.dark .learn-card{background:#13262b;color:var(--ink)}body.dark .metric,body.dark .note{background:#13272c}body.dark .ghost{background:#27444a;color:#e7f0ee}body.dark .correct{background:#164531;color:#dbf7e6}body.dark .wrong{background:#4b252a;color:#ffdadb}body.dark .spelling{background:#473d18;color:#ffe99e}@media(max-width:800px){.top .shell{flex-wrap:wrap}.nav{order:3;width:100%}.grid,.question-layout{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}.setup{grid-template-columns:1fr}.shell{padding-left:16px;padding-right:16px}.page{padding-top:24px}.photo{max-height:500px}.countdown{font-size:.9rem}.answer-row{flex-direction:column}.coverage{font-size:.82rem}.coverage th,.coverage td{padding:8px 5px}}
</style><style>.shell.page{padding:34px 24px 64px}.mode{background:#16404b}.coverage-section{margin-top:18px}.coverage-section summary{cursor:pointer;font-weight:800;font-size:1.08rem;padding:4px 0}.evidence-keyed{color:#075c57;font-weight:700}.evidence-class{color:#5d6d72}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.region-count{font-size:.82rem;color:var(--muted)}@media(max-width:800px){.shell.page{padding:24px 16px 64px}.top .mode{margin-left:auto}.nav{flex:1 0 100%}}</style></head><body><header class="top"><div class="shell"><div class="brand">Skeletal Lab<small>Practical II study lab</small></div><nav class="nav" aria-label="Primary"><button data-view="home" class="active">Study setup</button><button data-view="learn">Learn</button><button data-view="practice">Identification</button><button data-view="exam">Exam simulation</button><button data-view="progress">Progress</button><button data-view="coverage">Coverage</button></nav><button id="theme" class="mode" aria-label="Toggle color theme">◐ Theme</button></div></header><main class="shell page" id="app"></main><script src="data.js"></script><script>
const D=window.STUDY_DATA,Q=D.questions,app=document.querySelector('#app'),STORAGE_KEY='skullLabProgress';
let state={view:'home',pool:[],index:0,mode:'practice',answered:false,examAnswers:[],learn:Q[0],hideInfo:false};
const blankProgress=()=>({version:2,questions:{},misses:[]});
function load(){try{let p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!p)return blankProgress();if(p.version===2&&p.questions)return p;let migrated=blankProgress();Object.entries(p.attempts||{}).forEach(([id,a])=>{migrated.questions[id]={attempts:1,identified:a.correct?1:0,spelled:a.correct?1:0,incorrect:a.correct?0:1,spellingMistakes:0,skipped:a.skipped?1:0,lastExact:!!a.correct,lastAt:a.at||Date.now()}});migrated.misses=[...new Set(p.misses||[])];save(migrated);return migrated}catch{return blankProgress()}}
const save=p=>localStorage.setItem(STORAGE_KEY,JSON.stringify(p));
const norm=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
const dist=(a,b)=>{let m=[...Array(b.length+1)].map((_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,m[j]+1,m[j-1]+(a[i-1]===b[j-1]?0:1));m=n}return m[b.length]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function grade(q,response){let given=norm(response),accepted=[q.answer,...q.alternatives].map(norm),spelled=accepted.includes(given),nearest=Math.min(...accepted.map(a=>dist(given,a))),identified=spelled||(given.length>3&&nearest<=2);return{spelled,identified,kind:spelled?'correct':identified?'spelling':'incorrect'}}
function record(q,result,{skipped=false}={}){let p=load(),s=p.questions[q.id]||{attempts:0,identified:0,spelled:0,incorrect:0,spellingMistakes:0,skipped:0,lastExact:false,lastAt:null};s.attempts++;s.identified+=result.identified?1:0;s.spelled+=result.spelled?1:0;s.incorrect+=!result.identified?1:0;s.spellingMistakes+=result.identified&&!result.spelled?1:0;s.skipped+=skipped?1:0;s.lastExact=result.spelled;s.lastAt=Date.now();p.questions[q.id]=s;p.misses=(p.misses||[]).filter(id=>id!==q.id);if(!result.spelled)p.misses.push(q.id);p.misses=[...new Set(p.misses)];save(p)}
function stats(p=load()){let rows=Object.values(p.questions||{});return{attempts:rows.reduce((n,x)=>n+x.attempts,0),identified:rows.reduce((n,x)=>n+x.identified,0),spelled:rows.reduce((n,x)=>n+x.spelled,0),mastered:rows.filter(x=>x.lastExact).length,spellingMistakes:rows.reduce((n,x)=>n+x.spellingMistakes,0)}}
function startSession(mode,pool){state.pool=pool;state.index=0;state.mode=mode;state.answered=false;state.examAnswers=[]}
function nav(v,preserve=false){if(!preserve&&v==='practice')startSession('practice',shuffle([...Q]));if(!preserve&&v==='exam')startSession('exam',shuffle([...Q]));state.view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('skullLabTheme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('skullLabTheme')==='dark')document.body.classList.add('dark');
function imageMarkup(q,alt='Professor-provided class bone image with one highlighted structure'){return `<div class="image-frame"><div class="image-stage"><img class="photo" src="${q.image}" alt="${alt}"><span class="source-marker" style="--marker-x:${q.marker.x}%;--marker-y:${q.marker.y}%" role="img" aria-label="Highlighted question marker"></span></div></div>`}
const evidenceLabel=q=>q.verification==='keyed'?'Professor answer-key question':'Class photo + required term sheet';
function home(){let p=load(),s=stats(p),accuracy=s.attempts?`${Math.round(s.spelled/s.attempts*100)}%`:'—',keyed=Q.filter(q=>q.verification==='keyed').length,classCount=Q.length-keyed;return `<section class="intro"><div><div class="eyebrow">Class-photo practical practice</div><h1>Same images. More locations. Full skeletal review.</h1><p>Practice skull, axial, and appendicular structures with one clear marker at a time on your uploaded class images.</p></div><div class="countdown">${Q.length} playable locations</div></section><div class="grid"><section class="panel"><h2>Start a study set</h2><div class="setup"><div class="field"><label for="regionFilter">Skeletal region</label><select id="regionFilter"><option value="all">All three regions</option>${[...new Set(Q.map(q=>q.region))].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="viewFilter">Image / view</label><select id="viewFilter"><option value="all">All available images and views</option>${[...new Set(Q.map(q=>q.view))].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="catFilter">Anatomy category</label><select id="catFilter"><option value="all">All categories</option>${[...new Set(Q.map(q=>q.category))].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="countFilter">Questions</label><select id="countFilter"><option value="all">Every available question</option><option value="5">5 questions</option><option value="10">10 questions</option><option value="25">25 questions</option><option value="50">50 questions</option><option value="custom">Custom count…</option></select></div><div class="field"><label for="modeFilter">Practice mode</label><select id="modeFilter"><option value="practice">Identification + spelling</option><option value="spelling">Spelling focus</option><option value="exam">Exam simulation</option></select></div></div><label class="check"><input id="missedOnly" type="checkbox"> Previously missed questions only</label><div class="actions"><button class="primary" id="startSet">Start practice</button><button class="secondary" id="openLearn">Review marked structures</button></div><p class="note">The ${keyed} original questions remain answer-key verified. The ${classCount} added locations use the uploaded professor class photos and term sheet, and only mark structures visible in those views.</p></section><aside class="panel"><h2>Current progress</h2><div class="metrics"><div class="metric"><strong>${s.attempts}</strong><span>answers submitted</span></div><div class="metric"><strong>${accuracy}</strong><span>exact spelling accuracy</span></div><div class="metric"><strong>${p.misses.length}</strong><span>needs review</span></div><div class="metric"><strong>${s.mastered}</strong><span>currently mastered</span></div></div><h3 style="margin-top:20px">Material sources</h3><ul class="source-list"><li>${D.sources.practical}</li><li>${D.sources.termSheet}</li><li>${D.sources.photos}</li></ul></aside></div>`}
function startFromControls(){let r=document.querySelector('#regionFilter').value,v=document.querySelector('#viewFilter').value,c=document.querySelector('#catFilter').value,n=document.querySelector('#countFilter').value,mode=document.querySelector('#modeFilter').value,p=load();let pool=Q.filter(q=>(r==='all'||q.region===r)&&(v==='all'||q.view===v)&&(c==='all'||q.category===c));if(document.querySelector('#missedOnly').checked)pool=pool.filter(q=>p.misses.includes(q.id));if(!pool.length){alert('No playable questions match those settings. Try a broader set.');return}if(mode==='spelling')pool=pool.flatMap(q=>p.misses.includes(q.id)?[q,q]:[q]);if(mode==='exam')pool=[...new Map(pool.map(q=>[q.id,q])).values()];pool=shuffle([...pool]);if(n==='custom'){let requested=Number(prompt(`How many questions? (1-${pool.length})`,String(Math.min(10,pool.length))));if(!Number.isInteger(requested)||requested<1)return;n=String(Math.min(requested,pool.length))}if(n!=='all')pool=pool.slice(0,Math.min(+n,pool.length));startSession(mode,pool);nav(mode==='exam'?'exam':'practice',true)}
function questionPanel(exam=false){let q=state.pool[state.index];if(!q)return exam?examResults():practiceComplete();return `<div class="intro"><div><div class="eyebrow">${exam?'Exam simulation':'Identification practice'} · ${q.region}</div><h1>${exam?`Question ${state.index+1} of ${state.pool.length}`:state.mode==='spelling'?'Spell the structure':'What anatomical structure is indicated?'}</h1>${exam?'':`<p>Type the exact anatomical term for the highlighted structure.</p>`}</div>${exam?`<span class="small">No hints or feedback during this set</span>`:`<button class="ghost" id="skip">Skip for now</button>`}</div><div class="progressbar"><i style="width:${state.index/state.pool.length*100}%"></i></div><div class="question-layout"><section class="panel">${imageMarkup(q)}<div class="meta" style="margin-top:10px">${q.source} · ${evidenceLabel(q)}</div></section><aside class="panel"><span class="pill">${q.view}</span><h2>${exam?'Station prompt':'Your answer'}</h2><form id="answerForm"><label class="small" for="answer">Anatomical term</label><div class="answer-row"><input id="answer" autocomplete="off" autocapitalize="off" autofocus required><button class="primary">${exam?'Next':'Check answer'}</button></div></form><div id="feedback"></div>${!exam?`<div class="note">${q.category} · ${q.bone}</div>`:''}</aside></div>`}
function practice(){return questionPanel(false)}
function practiceComplete(){let p=load(),miss=Q.filter(q=>p.misses.includes(q.id));return `<section class="panel empty"><div class="eyebrow">Set complete</div><h1>Practice set finished</h1><p>${miss.length?`${miss.length} structure${miss.length===1?'':'s'} remain in your review list.`:'No structures remain in your review list.'}</p><div class="actions" style="justify-content:center">${miss.length?'<button class="primary" id="practiceMisses">Practice missed questions</button>':''}<button class="ghost" id="newSet">Choose another set</button></div></section>`}
function afterPractice(){let q=state.pool[state.index],form=document.querySelector('#answerForm'),skip=document.querySelector('#skip');form.onsubmit=e=>{e.preventDefault();if(state.answered)return;let response=document.querySelector('#answer').value,result=grade(q,response);state.answered=true;record(q,result);let f=document.querySelector('#feedback');f.className='feedback '+result.kind;f.innerHTML=result.spelled?`<strong>Correct.</strong> Spelling: <b>${q.answer}</b><br>${q.tip}`:result.identified?`<strong>Correct structure; spelling needs work.</strong> Correct spelling: <b>${q.answer}</b><br>${q.tip}`:`<strong>Identification error.</strong> Correct answer: <b>${q.answer}</b><br>${q.tip}`;form.querySelector('button').outerHTML='<button class="primary" id="next">Next question</button>';document.querySelector('#next').onclick=()=>{state.index++;state.answered=false;render()}};skip.onclick=()=>{record(q,{identified:false,spelled:false},{skipped:true});state.index++;state.answered=false;render()}}
function learn(){let q=state.learn||Q[0];return `<section class="intro"><div><div class="eyebrow">Learn mode · ${q.region}</div><h1>Review one marked structure at a time</h1><p>The same uploaded class images are reused for every clearly visible, testable location.</p></div><button class="ghost" id="toggleLabels">${state.hideInfo?'Reveal details':'Hide details'}</button></section><div class="question-layout"><section class="panel">${imageMarkup(q)}<p class="meta">${q.source}</p></section><aside class="panel"><span class="pill">${q.view}</span><h2>${state.hideInfo?'Details hidden':q.answer}</h2>${state.hideInfo?'<p class="small">Reveal details when you are ready to check yourself.</p>':`<div class="statline"><span>Associated bone</span><b>${q.bone}</b></div><div class="statline"><span>Category</span><b>${q.category}</b></div><div class="statline"><span>Evidence level</span><b>${evidenceLabel(q)}</b></div><div class="note"><b>Identification tip:</b> ${q.tip}</div>`}</aside></div><section class="panel" style="margin-top:22px"><h2>${Q.length} playable marked locations</h2><div class="learn-list">${Q.map(item=>`<button class="learn-card ${item.id===q.id?'active':''}" data-learn="${item.id}"><span class="pill">${item.region}</span><br><b>${state.hideInfo?'Structure details hidden':item.answer}</b><br><span class="small">${item.view}</span></button>`).join('')}</div></section>`}
function exam(){return questionPanel(true)}
function afterExam(){let q=state.pool[state.index],form=document.querySelector('#answerForm');form.onsubmit=e=>{e.preventDefault();let response=document.querySelector('#answer').value,result=grade(q,response);state.examAnswers.push({q,response,...result});record(q,result);state.index++;render()}}
function examResults(){let r=state.examAnswers,spelled=r.filter(x=>x.spelled).length,identified=r.filter(x=>x.identified).length,miss=r.filter(x=>!x.spelled),pct=n=>r.length?Math.round(n/r.length*100):0;return `<section class="panel"><div class="eyebrow">Exam complete</div><h1 class="review-title">${spelled} / ${r.length} exact</h1><div class="metrics"><div class="metric"><strong>${pct(spelled)}%</strong><span>overall score</span></div><div class="metric"><strong>${pct(identified)}%</strong><span>identification accuracy</span></div><div class="metric"><strong>${pct(spelled)}%</strong><span>spelling accuracy</span></div><div class="metric"><strong>${miss.length}</strong><span>requires review</span></div></div><p class="small">This study simulation samples the marked class-photo locations; it is not an exact reproduction of the professor’s practical.</p><div class="actions">${miss.length?'<button class="primary" id="mistakes">Practice my mistakes</button>':''}<button class="ghost" id="examAgain">New exam</button></div></section><section class="panel" style="margin-top:22px"><h2>Review missed structures</h2>${miss.length?`<div class="review-grid">${miss.map(x=>`<article class="review-card">${imageMarkup(x.q,'Missed skeletal structure')}<span class="pill">${x.q.region}</span><h3>${x.q.answer}</h3><p class="small">Your answer: ${x.response||'No answer'}<br>${x.identified?'Identification correct; spelling error':'Identification error'}</p></article>`).join('')}</div>`:'<p class="empty">Perfect set. There are no misses to review.</p>'}</section>`}
function progress(){let p=load(),s=stats(p),idRate=s.attempts?Math.round(s.identified/s.attempts*100):'—',spellRate=s.attempts?Math.round(s.spelled/s.attempts*100):'—';return `<section class="intro"><div><div class="eyebrow">Local study record</div><h1>Your progress</h1><p>Saved only in this browser. Every attempt is counted; the review list reflects each structure’s most recent exact answer.</p></div><button class="ghost" id="reset">Reset progress</button></section><div class="grid"><section class="panel"><div class="metrics"><div class="metric"><strong>${s.attempts}</strong><span>total attempts</span></div><div class="metric"><strong>${idRate}%</strong><span>identification accuracy</span></div><div class="metric"><strong>${spellRate}%</strong><span>exact spelling accuracy</span></div><div class="metric"><strong>${s.spellingMistakes}</strong><span>spelling mistakes</span></div></div></section><section class="panel"><h2>Structures needing practice</h2>${p.misses.length?p.misses.map(id=>{let q=Q.find(x=>x.id===id);return q?`<div class="statline"><span>${q.answer}</span><span class="small">${q.view}</span></div>`:''}).join(''):'<p class="empty">No active review list.</p>'}</section></div>`}
function coverage(){let regions=Object.keys(D.requirements),matches=(region,term)=>Q.filter(q=>q.region===region&&norm(q.coverageKey||q.answer)===norm(term)),totals=regions.map(region=>{let required=D.requirements[region],covered=required.filter(term=>matches(region,term).length).length;return{region,required:required.length,covered,questions:Q.filter(q=>q.region===region).length}}),allRequired=totals.reduce((n,x)=>n+x.required,0),allCovered=totals.reduce((n,x)=>n+x.covered,0);let tables=regions.map((region,i)=>`<details class="panel coverage-section" ${i===0?'open':''}><summary>${region} <span class="region-count">${totals[i].covered} of ${totals[i].required} required terms covered · ${totals[i].questions} playable locations</span></summary><table class="coverage"><thead><tr><th>Required term</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${D.requirements[region].map(term=>{let qs=matches(region,term),keyed=qs.find(q=>q.verification==='keyed'),q=keyed||qs[0];return `<tr><td>${term}</td><td><span class="status ${q?'playable':'needed'}">${q?'Playable':'Needs clearer view'}</span></td><td>${q?`<span class="${keyed?'evidence-keyed':'evidence-class'}">${keyed?'Professor answer key':`Class photo · ${q.source.match(/slide \d+/)?.[0]||'uploaded deck'}`}</span>`:'Not clearly identifiable in the provided images'}</td></tr>`}).join('')}</tbody></table></details>`).join('');return `<section class="intro"><div><div class="eyebrow">Required-term coverage</div><h1>${allCovered} of ${allRequired} required terms now have playable locations</h1><p>Coverage includes only structures that are visible enough to identify on the uploaded images. Uncovered terms stay listed instead of being guessed.</p></div><div class="countdown">${Q.length} total questions</div></section><section class="panel"><h2>Coverage by region</h2><div class="orientation-grid">${totals.map(x=>`<div class="orientation"><b>${x.region}</b><br>${x.covered}/${x.required} required terms<br><span class="small">${x.questions} marked locations</span></div>`).join('')}</div><div class="legend"><span class="status playable">Playable</span><span class="status needed">Needs clearer view</span></div><div class="note"><b>Evidence note:</b> “Professor answer key” means one of the original 12 keyed questions. “Class photo” means an added marker on the professor-provided image, matched to the required term sheet.</div></section>${tables}`}
function render(){app.innerHTML=({home,learn,practice,exam,progress,coverage}[state.view])();if(state.view==='home'){document.querySelector('#startSet').onclick=startFromControls;document.querySelector('#openLearn').onclick=()=>nav('learn')}if(state.view==='practice'&&state.pool[state.index])afterPractice();if(state.view==='practice'&&!state.pool[state.index]){let pm=document.querySelector('#practiceMisses');if(pm)pm.onclick=()=>{let p=load();startSession('practice',shuffle(Q.filter(q=>p.misses.includes(q.id))));render()};document.querySelector('#newSet').onclick=()=>nav('home')}if(state.view==='exam'&&state.pool[state.index])afterExam();if(state.view==='exam'&&!state.pool[state.index]){let m=document.querySelector('#mistakes');if(m)m.onclick=()=>{startSession('practice',shuffle(state.examAnswers.filter(x=>!x.spelled).map(x=>x.q)));nav('practice',true)};document.querySelector('#examAgain').onclick=()=>{startSession('exam',shuffle([...Q]));render()}}if(state.view==='learn'){document.querySelector('#toggleLabels').onclick=()=>{state.hideInfo=!state.hideInfo;render()};document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{state.learn=Q.find(q=>q.id===b.dataset.learn);render()})}if(state.view==='progress')document.querySelector('#reset').onclick=()=>{if(confirm('Reset all locally saved Skeletal Lab progress?')){localStorage.removeItem(STORAGE_KEY);render()}}}
render();
</script></body></html>
